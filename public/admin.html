<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>健康使用电脑 · 管理端</title>
  <link rel="stylesheet" href="/styles.css?v=20260815-6">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>健康使用电脑 · 管理端</h1>
        <p id="statusText">正在连接本地监控服务</p>
      </div>
      <button id="refreshBtn" title="刷新">刷新</button>
    </header>

    <section id="authPanel" class="panel">
      <h2 id="authTitle">设置管理密码</h2>
      <div class="row">
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="管理密码">
        <button id="authBtn">继续</button>
      </div>
      <p class="hint">管理密码用于进入设置、修改规则，以及从界面退出监控。</p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="grid statsGrid">
        <section class="panel">
          <div class="panelHeader">
            <h2>今日活跃使用</h2>
            <span id="todayLabel">前台累计 ≥3 分钟</span>
          </div>
          <div id="activeSummaryList" class="summary"></div>
        </section>

        <section class="panel">
          <div class="panelHeader">
            <h2>今日娱乐使用</h2>
            <span id="browserEntertainmentLabel">前台累计 ≥3 分钟</span>
          </div>
          <div id="browserSummaryList" class="summary"></div>
        </section>
      </div>

      <div class="grid">
        <section class="panel">
          <div class="panelHeader">
            <h2>当前前台窗口</h2>
            <span id="monitorBadge">运行中</span>
          </div>
          <dl class="current">
            <dt>应用</dt><dd id="currentApp">-</dd>
            <dt>标题</dt><dd id="currentTitle">-</dd>
          </dl>
        </section>

        <section class="panel">
          <h2>每日娱乐总额度</h2>
          <p class="hint">软件和浏览器标签页共用这个额度。DeepSeek 会评估软件和网页用途，娱乐、社交都会计入。</p>
          <label>工作日总额度（分钟）</label>
          <input id="entertainmentWeekdayLimit" type="number" min="0" step="1">
          <label>非工作日总额度（分钟）</label>
          <input id="entertainmentWeekendLimit" type="number" min="0" step="1">
          <label>DeepSeek 模型</label>
          <input id="aiModel" type="text" value="deepseek-v4-pro" readonly spellcheck="false">
          <label class="checkRow">
            <input id="aiEnabled" type="checkbox">
            <span>启用 AI 分类</span>
          </label>
          <div class="actions">
            <button id="saveConfigBtn">保存使用时间</button>
            <span id="saveFeedback" class="saveFeedback" role="status" aria-live="polite"></span>
          </div>
          <div class="actions">
            <button id="shutdownBtn" class="danger">退出监控</button>
          </div>
        </section>
      </div>

      <section class="panel unknownPanel">
        <div class="panelHeader">
          <h2>待分类软件</h2>
          <span id="unknownAppCount">0 个</span>
        </div>
        <p class="hint">AI 无法确认的软件不会计入娱乐时长。请在这里选择分组，保存后立即生效。</p>
        <div id="unknownAppsList" class="unknownApps"></div>
        <p id="unknownAppsFeedback" class="saveFeedback" role="status" aria-live="polite"></p>
      </section>
    </section>
  </main>
  <script src="/app.js?v=20260815-4"></script>
</body>
</html>
